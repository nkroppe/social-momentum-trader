# Market data, price confirmation, regime filter, and volatility sizing.
#
# Candles come from Coinbase's public market-data API (no credentials needed),
# so these controls behave the same in paper and live mode.

candle_granularity_seconds: 3600   # 1h candles
atr_periods: 14
cache_ttl_seconds: 300             # re-fetch candles at most every 5 min
price_cache_ttl_seconds: 2
request_timeout_seconds: 15
unavailable_retry_seconds: 900     # back off products Coinbase does not list

# Deployed PAPER is executable and fail-closed: a fresh level-1 book and a
# contiguous, newly closed one-minute feed are required. Random prices exist
# only behind the explicit offline simulation path.
paper_use_real_prices: true
paper_quote_max_age_seconds: 10
paper_bar_granularity_seconds: 60
paper_bar_max_age_seconds: 300       # public closed-candle endpoint can lag several minutes
paper_bar_cache_ttl_seconds: 10
paper_max_spread_bps: 40
paper_min_top_level_notional_usd: 100
paper_max_top_level_participation: 0.50
paper_adverse_slippage_bps: 5
candle_max_age_multiplier: 1.10

# Hard production latch for the deterministic multi-timeframe setup engine.
# Offline `smt simulate` disables this in memory; deployed runs fail closed.
price_action_enabled: true
price_action_fail_closed: true

# A social spike is only actionable if price is confirming it. Without this the
# bot buys attention generated by a crash as eagerly as attention from a rally.
confirmation:
  enabled: true
  fail_closed: true          # no market data -> no entry
  require_above_sma: true
  sma_periods: 24            # 24 x 1h = 1 day
  require_positive_return: true
  min_volume_zscore: 0.0     # raise to ~1.0 to demand a real volume expansion
  volume_periods: 24

# Broad-market trend gate. Long-only alt momentum bleeds in a BTC downtrend.
regime:
  enabled: true
  benchmark_product_id: BTC-USD
  granularity_seconds: 86400   # daily candles
  sma_periods: 50
  fail_closed: true

# Equalize risk across a universe spanning BTC to sub-cent tokens. Scale is
# capped at 1.0, so this only ever reduces size below max_position_pct.
sizing:
  enabled: true
  target_atr_pct: 0.02   # size as if every asset had a 2% ATR
  min_scale: 0.25
  max_scale: 1.0
