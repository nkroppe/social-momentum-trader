# Social sources config. Ingest polls on a schedule (hours->intraday horizon).

# Sized to the read budget rather than to what the strategy would prefer. At
# $100/mo (20k distinct posts) the daily pace is ~780 posts; seven queries
# returning the API's 10-post minimum costs ~70 per poll, so ~11 polls/day is
# the most that fits. Two hours also matches the swing bucket width, which is
# the timeframe this much data can actually support.
poll_interval_seconds: 7200  # 2h

reddit:
  enabled: false   # enable when REDDIT_* creds are approved
  subreddits:
    - CryptoCurrency
    - CryptoMarkets
    - solana
    - Bitcoin
    - ethereum
  # How many new posts/comments to pull per subreddit per poll.
  limit_per_subreddit: 50

x:
  enabled: true
  # Accounts to watch (recent tweets from each). No @ prefix required.
  watch_accounts: []
  # Cashtag/keyword recent-search queries. Keep tight to control API spend.
  # No $BTC or $ETH: both are `major` tier, which runs in trend mode and never
  # consults the social gate. Their cashtags are also the highest-volume ones
  # on the list, so paying to read posts the strategy discards is the single
  # most expensive thing this file could do.
  keywords:
    - "$SOL"
    - "$LINK"
    - "$HYPE"
    - "$ZEC"
    - "$PUMP"
    - "$BICO"
    - "$CAP"
  # 10 is the API's minimum for recent search, and the budget cannot afford
  # more. Every returned post is billed on first sight, so this is the floor on
  # cost per query and the reason poll cadence carries the rest of the saving.
  max_results_per_query: 10
  mention_weight: 2.0        # X mentions weighted higher than Reddit in scorer
  exclude_retweets: true     # spend budget on original posts, not amplification
  exclude_replies: true

# Mock off for VPS paper soak — X-only. Set enabled: true for local dev without API keys.
mock:
  enabled: false
  events_per_poll: 30
