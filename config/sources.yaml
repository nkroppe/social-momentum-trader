# Social sources config. Ingest polls on a schedule (hours->intraday horizon).

# Every poll buys one $0.005 recent-count request per keyword. Six symbols at
# 48 windows/day cost about $43.20/month. Post reads are bought only when a
# count anomaly (or scheduled cold-start window) triggers a 25-post sample.
# Endpoint prices and the shared $100 ceiling are environment-configurable.
poll_interval_seconds: 1800  # UTC-aligned 30-minute count windows

reddit:
  enabled: false   # enable when REDDIT_* creds are approved
  subreddits:
    - CryptoCurrency
    - CryptoMarkets
    - solana
    - Bitcoin
    - ethereum
  # How many new posts/comments to pull per subreddit per poll.
  limit_per_subreddit: 50

x:
  enabled: true
  # Accounts to watch (recent tweets from each). No @ prefix required.
  watch_accounts: []
  # Cashtag/keyword recent-search queries. Keep tight to control API spend.
  # No $BTC or $ETH: both are `major` tier, which runs in trend mode and never
  # consults the social gate. Their cashtags are also the highest-volume ones
  # on the list, so paying to read posts the strategy discards is the single
  # most expensive thing this file could do.
  keywords:
    - "$SOL"
    - "$HYPE"
    - "$ZEC"
    - "$PUMP"
  counts_enabled: true
  count_window_minutes: 30
  count_granularity: minute
  trigger_min_count: 8
  trigger_zscore: 2.0
  trigger_relative_multiple: 2.0
  trigger_min_baseline_windows: 24  # 12h before adaptive baseline is trusted
  cold_start_sample_interval: 12
  sample_size: 25
  # Kept for migration compatibility when counts are disabled.
  max_results_per_query: 25
  mention_weight: 2.0        # X mentions weighted higher than Reddit in scorer
  exclude_retweets: true     # spend budget on original posts, not amplification
  exclude_replies: true

# Mock off for VPS paper soak — X-only. Set enabled: true for local dev without API keys.
mock:
  enabled: false
  events_per_poll: 30
