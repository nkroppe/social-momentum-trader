# Ops: soak tracking, periodic digests, and deployment preflight checks.

soak:
  state_file: ./data/soak.json
  digest_interval_hours: 24

preflight:
  # Reddit access is intentionally disabled pending API approval; X is the
  # production social source and mock data must remain disabled.
  require_reddit: false
  require_x: true
  require_alert_channel: true
  require_postgres: true

# Push a message on every entry and exit. Exits carry realized P/L.
trade_alerts:
  enabled: true
  on_open: true
  on_close: true

# Phone control via the same Telegram bot/chat used for alerts.
# Exact messages only, from TELEGRAM_CHAT_ID:
#   KILL  -> flatten all positions and pause new entries
#   START -> clear the kill switch and resume trading
telegram_control:
  enabled: true
  state_file: ./data/telegram_control.json
  request_timeout_seconds: 5

# Scheduled performance summary. Sent on local wall-clock time, so the hour
# stays put across daylight saving rather than drifting with UTC.
weekly_report:
  enabled: true
  timezone: America/New_York
  weekday: sunday
  hour: 20            # 24h clock -> 8 PM
  minute: 0
  state_file: ./data/weekly_report.json
  max_trades_listed: 40

# Advisory evidence thresholds for `smt shadow-report`. These deliberately
# fail closed on short observation spans, count downtime, small outcome groups,
# unresolved outcomes, LLM errors, or weak realized expectancy separation.
shadow_report:
  report_days: 28
  min_observation_days: 28
  min_count_coverage: 0.95
  min_closed_linked_trades_per_tier: 30
  # Each pass/reject group needs this many linked, closed outcomes. Raw audit
  # counts remain visible but do not satisfy the evidence floor.
  min_completed_per_outcome_group: 10
  min_llm_completion_rate: 0.95
  max_llm_error_rate: 0.05
  min_expectancy_separation_r: 0.25
