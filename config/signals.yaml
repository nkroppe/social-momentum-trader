# Social signal quality: spam filtering, sentiment polarity, and tier profiles.

default_tier: mid

# Social rules stay in shadow (never enforce). X ingest is currently paused, so
# this path is a no-op until sources.x.enabled is turned back on.
social_decision_mode: shadow

# Directional posts required before the bullish ratio is trusted as a gate.
min_sentiment_posts: 5

# Cashtag streams are heavily farmed. These run at ingest time, before events
# ever reach the scorer, so mention counts reflect genuine attention.
spam:
  enabled: true
  drop_retweets: true
  max_cashtags_per_post: 4        # shotgun posts listing 10 tickers are noise
  max_urls_per_post: 2
  min_author_followers: 100
  min_text_chars: 15
  dedup_window_minutes: 120
  max_posts_per_author_per_window: 3
  blocklist_phrases:
    - airdrop
    - giveaway
    - free crypto
    - dm me
    - join our
    - signal group
    - pump group
    - not financial advice guaranteed
    - 100x guaranteed
    - click the link
    - telegram channel

# Lexicon-based polarity. Cheap, deterministic, and auditable; it separates
# "breaking out" from "getting liquidated", which mention counting cannot.
sentiment:
  enabled: true
  require_directional: false
  # Quoted: YAML would otherwise read `no` as a boolean.
  negations: ["not", "no", "never", "isnt", "aint", "dont", "wont", "cant"]
  bullish_terms:
    - bullish
    - breakout
    - breaking out
    - moon
    - mooning
    - ath
    - all time high
    - accumulating
    - accumulation
    - long
    - longing
    - buying
    - bought
    - send it
    - sending
    - rally
    - rallying
    - pumping
    - squeeze
    - reclaim
    - reclaimed
    - support holding
    - golden cross
    - inflows
    - strong
    - undervalued
  bearish_terms:
    - bearish
    - dump
    - dumping
    - dumped
    - crash
    - crashing
    - rug
    - rugged
    - rekt
    - liquidated
    - liquidation
    - short
    - shorting
    - selling
    - sold
    - exit liquidity
    - dead cat
    - breakdown
    - breaking down
    - lost support
    - death cross
    - outflows
    - capitulation
    - bleeding
    - overvalued
    - scam

# Per-tier profiles, selected by each symbol's `tier` in universe.yaml.
#
# Research consistently finds social signals are far more predictive for small
# caps than large: majors are efficient enough that attention spikes are weak
# and frequently contrarian, so they trade on trend instead.
tiers:
  major:
    signal_mode: trend           # BTC/ETH: price trend decides, social is ignored
    social_policy: ignored
    min_relative_volume: 1.5
    retest_policy: preferred
    allow_vwap_pullback: true
    zscore_mult: 2.0
    min_mentions_mult: 2.0
    min_trailing_return_pct: 0.01
    max_position_pct_mult: 1.0

  large:
    signal_mode: hybrid          # SOL: price is hard; social may boost or veto
    social_policy: optional
    min_relative_volume: 1.5
    retest_policy: preferred
    allow_vwap_pullback: true
    optional_social_boost: 1.10
    social_veto_bullish_ratio: 0.40
    zscore_mult: 1.4
    min_mentions_mult: 1.5
    min_trailing_return_pct: 0.005
    max_position_pct_mult: 1.0

  mid:
    signal_mode: hybrid
    social_policy: required
    min_relative_volume: 2.0
    retest_policy: required
    allow_vwap_pullback: false
    zscore_mult: 1.0
    min_mentions_mult: 1.0
    min_trailing_return_pct: 0.0
    max_position_pct_mult: 0.8

  micro:
    signal_mode: social          # catalyst required, but price breakout remains hard
    social_policy: catalyst
    min_relative_volume: 2.0
    retest_policy: required
    allow_vwap_pullback: false
    zscore_mult: 0.8
    min_mentions_mult: 0.8
    min_trailing_return_pct: 0.0
    max_position_pct_mult: 0.5   # smallest slice: highest volatility and spread
