# Hard risk limits. The trader CANNOT override these at runtime.
# Tuned conservatively for a ~$1k-$10k isolated portfolio.

# Fraction of the isolated portfolio deployable into a single position.
max_position_pct: 0.10

# Dollar risk budget per trade. Notional = equity * this value / structure-stop
# distance, then all exposure caps below can only reduce it.
risk_per_trade_pct: 0.005

# Max simultaneous open positions.
max_open_positions: 3

# Max NEW entries opened per rolling 24h.
max_trades_per_day: 8

# Halt opening new trades if realized+unrealized PnL for the day drops below this
# fraction of starting-of-day equity (e.g. -0.05 = -5%).
daily_loss_halt_pct: -0.05

# Weekly equivalent.
weekly_loss_halt_pct: -0.12

# After a stop-out on a symbol, ignore new signals for it for this many minutes.
cooldown_minutes_after_stop: 120

# Shared exit defaults. Strategies override these in config/strategies.yaml.
exit:
  label: default_v2
  mode: partial_trail
  exit_style: atr
  atr_take_profit_mult: 2.0
  atr_stop_loss_mult: 1.0
  atr_min_stop_pct: 0.008
  atr_max_stop_pct: 0.15
  advanced_exit_enabled: true
  partial_take_profit_fraction: 0.25
  partial_take_profit_r: 1.5
  chandelier_atr_mult: 2.5
  trail_granularity_seconds: 3600
  stale_time_stop_hours: 4
  stale_mfe_r: 0.5
  take_profit_pct: 0.06
  stop_loss_pct: 0.03
  time_stop_hours: 12

# Minimum notional per order (avoid dust / fee-dominated trades), USD.
min_order_notional_usd: 25

# Assumed round-trip fee for paper sizing sanity (Coinbase taker ~ per side).
assumed_fee_pct_per_side: 0.006

# --- Signal entry thresholds (tuned during paper soak) ---
# Velocity z-score required to consider an entry.
signal_min_zscore: 2.5
# Require confirmation across at least this many distinct sources.
signal_min_distinct_sources: 1
# Require this many distinct accounts. With a single source this is the real
# manipulation guard: one loud account cannot manufacture a signal.
signal_min_distinct_authors: 3
# Require at least this many raw mentions over the lookback window.
signal_min_mentions: 8
# Fraction of directional posts that must be bullish. Mention counts alone
# treat "getting liquidated" as a buy signal; this filters that out.
signal_min_bullish_ratio: 0.60
# Scorer bucketing.
scorer_bucket_minutes: 30
scorer_lookback_buckets: 8

# --- Price confirmation ---
# Trailing return window (hours) that must be positive before a social spike
# counts as an entry. See config/market.yaml for the rest of the gate.
confirm_lookback_hours: 4
confirm_min_return_pct: 0.0
