# Tradeable universe: long-only USD spot pairs on Coinbase Advanced Trade ONLY.
# Product IDs must match Coinbase Advanced (e.g. BTC-USD). This bot does not
# support other venues (Robinhood, Phantom, Bullpen, on-chain DEX).

quote_currency: USD

# Each entry maps an internal ticker -> Coinbase product_id + aliases used
# to detect mentions in social text.
#
# `tier` selects a signal profile from config/signals.yaml. Majors trade on
# price trend (attention is weak and often contrarian for them); micro-caps
# trade on social, which is where the crowd genuinely leads price.
symbols:
  BTC:
    product_id: BTC-USD
    tier: major
    aliases: ["btc", "bitcoin", "$btc"]
  ETH:
    product_id: ETH-USD
    tier: major
    aliases: ["eth", "ethereum", "$eth"]
  SOL:
    product_id: SOL-USD
    tier: large
    aliases: ["sol", "solana", "$sol"]
  LINK:
    product_id: LINK-USD
    tier: mid
    aliases: ["link", "chainlink", "$link"]
  HYPE:
    product_id: HYPE-USD
    tier: mid
    aliases: ["hype", "hyperliquid", "$hype"]
  ZEC:
    product_id: ZEC-USD
    tier: mid
    aliases: ["zec", "zcash", "z cash", "$zec"]
  PUMP:
    product_id: PUMP-USD
    tier: micro
    aliases: ["pump", "pumpfun", "pump.fun", "pump fun", "$pump"]
  BICO:
    product_id: BICO-USD
    tier: micro
    aliases: ["bico", "biconomy", "$bico"]
  CAP:
    product_id: CAP-USD
    tier: micro
    # "market cap" / "no cap" / "low cap gem" are constant on crypto Twitter, so
    # a bare word match here would be almost entirely false positives.
    require_cashtag: true
    aliases: ["$cap"]

# Symbols to never trade even if mentioned.
denylist: []
