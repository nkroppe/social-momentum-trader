# Tradeable universe: long-only USD spot pairs on Coinbase Advanced.
# Only symbols on this allowlist can ever be traded. Start liquid.

quote_currency: USD

# Each entry maps an internal ticker -> Coinbase product_id + aliases used
# to detect mentions in social text.
symbols:
  BTC:
    product_id: BTC-USD
    aliases: ["btc", "bitcoin", "$btc"]
  ETH:
    product_id: ETH-USD
    aliases: ["eth", "ethereum", "$eth"]
  SOL:
    product_id: SOL-USD
    aliases: ["sol", "solana", "$sol"]
  DOGE:
    product_id: DOGE-USD
    aliases: ["doge", "dogecoin", "$doge"]
  XRP:
    product_id: XRP-USD
    aliases: ["xrp", "ripple", "$xrp"]
  ADA:
    product_id: ADA-USD
    aliases: ["ada", "cardano", "$ada"]
  AVAX:
    product_id: AVAX-USD
    aliases: ["avax", "avalanche", "$avax"]
  LINK:
    product_id: LINK-USD
    aliases: ["link", "chainlink", "$link"]

# Symbols to never trade even if mentioned.
denylist: []
