# Tradeable universe: long-only USD spot pairs on Coinbase Advanced Trade ONLY.
# Product IDs must match Coinbase Advanced (e.g. BTC-USD). This bot does not
# support other venues (Robinhood, Phantom, Bullpen, on-chain DEX).

quote_currency: USD

# Each entry maps an internal ticker -> Coinbase product_id + aliases used
# to detect mentions in social text.
symbols:
  BTC:
    product_id: BTC-USD
    aliases: ["btc", "bitcoin", "$btc"]
  ETH:
    product_id: ETH-USD
    aliases: ["eth", "ethereum", "$eth"]
  SOL:
    product_id: SOL-USD
    aliases: ["sol", "solana", "$sol"]
  LINK:
    product_id: LINK-USD
    aliases: ["link", "chainlink", "$link"]
  HYPE:
    product_id: HYPE-USD
    aliases: ["hype", "hyperliquid", "$hype"]
  ZEC:
    product_id: ZEC-USD
    aliases: ["zec", "zcash", "z cash", "$zec"]
  PUMP:
    product_id: PUMP-USD
    aliases: ["pump", "pumpfun", "pump.fun", "pump fun", "$pump"]

# Symbols to never trade even if mentioned.
denylist: []
