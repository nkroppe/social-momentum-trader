# Two trading methodologies running simultaneously with a capital split.
# Any field omitted here inherits from config/risk.yaml (global defaults).
# Enabled allocations must sum to <= 1.0. time_stop_hours is capped at 72.

strategies:
  # Existing hours-to-intraday behavior (matches pre-dual-strategy defaults).
  intraday:
    enabled: true
    allocation: 0.5
    take_profit_pct: 0.06
    stop_loss_pct: 0.03
    time_stop_hours: 6
    signal_min_zscore: 2.5
    signal_min_distinct_sources: 1   # X-only soak; raise to 2 when Reddit is added
    signal_min_mentions: 8
    scorer_bucket_minutes: 30
    scorer_lookback_buckets: 8

  # New 1-3 day swing: longer hold, wider targets, stricter entry, longer lookback.
  swing:
    enabled: true
    allocation: 0.5
    take_profit_pct: 0.15
    stop_loss_pct: 0.07
    time_stop_hours: 48          # configurable up to 72
    signal_min_zscore: 3.0
    signal_min_distinct_sources: 1   # X-only soak; raise to 2 when Reddit is added
    signal_min_mentions: 15
    scorer_bucket_minutes: 120
    scorer_lookback_buckets: 12
