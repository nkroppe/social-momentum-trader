[project]
name = "social-momentum-trader"
version = "0.1.0"
description = "24/7 long-only spot crypto trader driven by social-momentum signals, with hard risk + fund-protection guardrails."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Live/real integrations are opt-in so the paper loop runs with zero external keys.
live = [
    "praw>=7.7",                       # Reddit
    "coinbase-advanced-py>=1.2",       # Coinbase Advanced Trade
    "psycopg[binary]>=3.2",            # Postgres driver
]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]

[project.scripts]
smt = "smt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
